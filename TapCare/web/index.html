<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent}button,a,label,[data-act]{touch-action:manipulation}</style><script src="supabase.js"></script></head><body>
<title>TapCare Clinic Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: welcome screen picks the path (patient · doctor); patient handout is one calm column with sticky section chips; doctor portal and admin console are compact tabbed dashboards */
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --sunk:#EEF0F3; --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#E6F2F0; --warm:#DC2626; --warm-soft:#FDECEC; --glucose:#B7791F; --on-alert:#FFFFFF;
  --good:#16A34A; --good-soft:#E8F6EC; --bad:#DC2626; --bad-soft:#FDECEC;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 18px rgba(17,24,39,.06);
  --ease:cubic-bezier(.22,.8,.26,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111827; --surface:#1F2937; --sunk:#0B1220; --ink:#E5E7EB; --muted:#9CA3AF; --line:#374151;
  --accent:#2DD4BF; --accent-ink:#042F2E; --accent-soft:#153B3A; --warm:#F87171; --warm-soft:#3B1E22; --glucose:#FBBF24; --on-alert:#2A0B0B;
  --good:#4ADE80; --good-soft:#14301F; --bad:#F87171; --bad-soft:#3B1E22; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111827; --surface:#1F2937; --sunk:#0B1220; --ink:#E5E7EB; --muted:#9CA3AF; --line:#374151;
  --accent:#2DD4BF; --accent-ink:#042F2E; --accent-soft:#153B3A; --warm:#F87171; --warm-soft:#3B1E22; --glucose:#FBBF24; --on-alert:#2A0B0B;
  --good:#4ADE80; --good-soft:#14301F; --bad:#F87171; --bad-soft:#3B1E22; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

html{font-size:16px;scroll-padding-top:72px}
html.big{font-size:18.5px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[lang="ar"]{--f-display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
[lang="ar"] h1,[lang="ar"] h2,[lang="ar"] h3{line-height:1.35}
h1{font-size:clamp(2rem,5.4vw,3.2rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:clamp(1.45rem,3.4vw,2rem);font-weight:700;letter-spacing:-.012em}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
[lang="ar"] .label{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:.82rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}

/* Header */
.site{display:flex;align-items:center;gap:10px;padding-block:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.15rem;min-width:0}
.logo i{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo i svg{width:16px;height:16px}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;color:var(--muted)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;transition:transform .2s var(--ease),border-color .2s}
.pill:hover{border-color:var(--accent)}
.pill:active{transform:scale(.96)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill svg{width:16px;height:16px}

/* Buttons + forms */
.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.btn:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:none;border-color:var(--accent)}
.btn.warm{background:var(--warm);color:var(--on-alert)}
.btn.ghost.alert{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost.alert:hover{border-color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}
[dir="rtl"] .btn .arr{transform:scaleX(-1)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:6px}
.field > span{font-size:.88rem;font-weight:700}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em}
.form{display:grid;gap:14px}

/* Welcome */
.welcome{min-height:100%;display:grid;align-content:center;padding-block:32px 48px;gap:28px}
.wel-head{display:grid;gap:10px;max-width:40ch}
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.path{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:20px;display:grid;gap:8px;align-content:start;text-align:start;cursor:pointer;transition:border-color .2s,transform .25s var(--ease),box-shadow .25s}
.path:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.path.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.path.main .muted{color:color-mix(in srgb,var(--accent-ink) 80%,transparent)}
.path .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.path.main .ico{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);color:var(--accent-ink)}
.path .ico svg{width:22px;height:22px}
.path h3{font-size:1.25rem}
.path > span:last-child svg{width:20px;height:20px}
.demo-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.85rem;color:var(--muted)}
.demo-row select{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--warm-soft);color:var(--warm)}

/* Section chips */
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.chips nav{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips nav::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--muted);font-size:.9rem;padding:6px 13px;border-radius:999px;transition:background .25s var(--ease),color .25s}
.chips a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:28px 40px}
.hero.solo{grid-template-columns:minmax(0,1fr)}
.hero .lede{font-size:1.15rem;color:var(--muted);margin-top:14px;max-width:48ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--accent);font-weight:700;margin-bottom:12px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* Tap scene */
.scene{position:relative;aspect-ratio:1/1;max-width:100%;max-height:420px;width:100%;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 110%,var(--accent-soft),transparent 60%),var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.desk{position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(var(--sunk),color-mix(in srgb,var(--sunk) 60%,var(--surface)))}
.card{position:absolute;left:50%;bottom:14%;width:min(58%,260px);aspect-ratio:1.55;transform:translateX(-50%) perspective(700px) rotateX(52deg);transform-origin:50% 100%;
  border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 30px rgba(19,38,43,.18);display:grid;place-items:center}
.card .mark{width:30%;aspect-ratio:1;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center}
.card .mark::after{content:"";width:28%;aspect-ratio:1;border-radius:50%;background:var(--accent)}
.ring{position:absolute;left:50%;bottom:30%;width:24%;aspect-ratio:1;border:2px solid var(--accent);border-radius:50%;transform:translate(-50%,50%) scale(.4);opacity:0}
.phone{will-change:transform;position:absolute;left:50%;top:5%;height:56%;aspect-ratio:.5;transform:translateX(-50%);border-radius:22px;background:var(--ink);padding:5px;box-shadow:0 20px 40px rgba(19,38,43,.25)}
.screen{width:100%;height:100%;border-radius:17%/9%;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;gap:7px;padding:16px 10px}
.screen i{display:block;height:7px;border-radius:4px;background:var(--line);transform-origin:left;transform:scaleX(.2);opacity:.5}
.screen i.h{height:12px;width:80%;background:var(--accent)}
.screen i.b{height:40px;background:var(--accent-soft)}
.screen i:nth-child(3){width:90%}.screen i:nth-child(5){width:70%}.screen i:nth-child(6){width:85%}
.scene.play .phone{animation:phone 4.4s var(--ease) infinite}
.scene.play .ring{animation:ring 4.4s ease-out infinite}
.scene.play .ring.r2{animation-delay:.15s}
.scene.play .screen i{animation:fill 4.4s var(--ease) infinite}
.scene.play .screen i:nth-child(2){animation-delay:.06s}.scene.play .screen i:nth-child(3){animation-delay:.12s}
.scene.play .screen i:nth-child(4){animation-delay:.18s}.scene.play .screen i:nth-child(5){animation-delay:.24s}.scene.play .screen i:nth-child(6){animation-delay:.3s}
@keyframes phone{0%,8%{transform:translateX(-50%) translateY(0) rotate(-6deg)}30%,46%{transform:translateX(-50%) translateY(26%) rotate(0)}66%,100%{transform:translateX(-50%) translateY(0) rotate(-6deg)}}
@keyframes ring{0%,28%{opacity:0;transform:translate(-50%,50%) scale(.4)}32%{opacity:.9}62%,100%{opacity:0;transform:translate(-50%,50%) scale(3.2)}}
@keyframes fill{0%,34%{transform:scaleX(.2);opacity:.5}48%,88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(.2);opacity:.5}}
.scene .cap{z-index:2;position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted)}

/* Sections */
section.block{padding-block:44px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.sec-head{display:grid;gap:8px;max-width:62ch}
.sec-head p{color:var(--muted);font-size:1.05rem}
.pre{transform:translateY(18px);transition:transform .7s var(--ease)}
.pre.in{transform:none}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}

/* Simple explanation */
.simple{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;box-shadow:var(--shadow)}
.simple svg.vis{width:120px;height:120px}
.simple p{font-size:1.2rem;line-height:1.65}
.facts{display:grid;gap:10px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact b{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.fact b svg{width:16px;height:16px}

/* Mechanism */
.explain{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.stage svg{display:block;width:100%;height:auto}
.steps{display:grid;gap:4px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:10px;border-radius:12px;cursor:pointer;transition:background .25s}
.step:hover{background:var(--surface)}
.step.on{background:var(--surface);box-shadow:var(--shadow)}
.step .n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);transition:all .3s var(--ease)}
.step.on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;margin-top:8px;width:max-content;max-width:100%}
[dir="rtl"] .switch{padding:6px 6px 6px 14px}
.switch .track{flex:none;width:44px;height:26px;border-radius:999px;background:var(--sunk);position:relative;transition:background .3s}
.switch .knob{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .3s var(--ease)}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .knob{inset-inline-start:21px}
.switch.warn[aria-checked="true"] .track{background:var(--warm)}
.note{font-size:.9rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;max-width:72ch}
.note svg{flex:none;width:18px;height:18px;color:var(--accent);margin-top:2px}

/* Adherence */
.adhere{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
.graph{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
.graph svg{display:block;width:100%;height:auto}
.graph .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.graph .legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}
#adhLine{transition:d .6s var(--ease)}
.pills7{display:flex;gap:6px}
.pills7 span{flex:1;height:28px;border-radius:8px;display:grid;place-items:center;font-size:.72rem;font-family:var(--f-mono);background:var(--accent-soft);color:var(--accent);transition:background .4s,color .4s}
.pills7 span.off{background:var(--warm-soft);color:var(--warm);text-decoration:line-through}
.tiplist{display:grid;gap:10px}
.tiplist div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tiplist b{grid-row:span 2;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem}
.tiplist p{color:var(--muted);font-size:.95rem}

/* Missed dose */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:f}
.flow div{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:6px;align-content:start}
.flow div:last-child{border-color:var(--warm);background:color-mix(in srgb,var(--warm-soft) 45%,var(--surface))}
.flow .ico{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.flow div:last-child .ico{background:var(--warm-soft);color:var(--warm)}
.flow .ico svg{width:20px;height:20px}

/* Side effects */
.se{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.se-col{border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;border:1px solid var(--line);background:var(--surface)}
.se-col.urgent{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad-soft) 55%,var(--surface))}
.se-col h3{display:flex;gap:10px;align-items:center}
.se-col h3 i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.se-col.urgent h3 i{background:var(--bad);color:var(--on-alert)}
.se-col h3 i svg{width:17px;height:17px}
.se-col ul{margin:0;padding-inline-start:1.1em;display:grid;gap:8px}
.callout{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 16px;background:var(--accent-soft);color:var(--ink)}
.callout svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:2px}

/* Prevention */
.prev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.prev div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.prev .ico{width:40px;height:40px;border-radius:12px;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.prev .ico svg{width:22px;height:22px}
.prev p{color:var(--muted);font-size:.95rem}

/* Lifestyle */
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:14px;width:max-content;max-width:100%}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:10px;cursor:pointer;color:var(--muted);transition:background .25s var(--ease),color .25s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px;align-content:start}
.tip .num{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2rem;line-height:1;color:var(--accent);letter-spacing:-.02em}
[lang="ar"] .tip .num{font-family:var(--f-display);font-size:1.6rem}
.tip p{color:var(--muted)}
.tips.anim .tip{animation:up .5s var(--ease) both}
.tips.anim .tip:nth-child(2){animation-delay:.07s}.tips.anim .tip:nth-child(3){animation-delay:.14s}
@keyframes up{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}

/* Myths */
.myths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.flip{perspective:1000px;border:0;background:none;padding:0;cursor:pointer;text-align:start;min-height:200px}
.flip .in{position:relative;display:grid;height:100%;transition:transform .7s var(--ease);transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface)}
.face.back{transform:rotateY(180deg)}
.face .q{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.3}
.face .hint{margin-top:auto;font-size:.85rem;color:var(--accent);display:flex;align-items:center;gap:6px}
.verdict{align-self:flex-start;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px}
.verdict.myth{background:var(--warm-soft);color:var(--warm)}
.verdict.fact{background:var(--good-soft);color:var(--good)}

/* FAQ accordion */
.faq{display:grid;gap:8px;max-width:760px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .3s var(--ease);margin-top:-4px}
.faq details[open] summary::after{transform:rotate(225deg);margin-top:4px}
.faq details > div{padding:0 18px 16px;color:var(--muted)}
.faq details[open] > div{animation:up .35s var(--ease)}

/* Assistant */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:760px;height:min(560px,78vh)}
.chat-top{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.bot{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.bot svg{width:22px;height:22px}
.chat-log{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;animation:up .3s var(--ease)}
.msg.you{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:4px}
.msg.them{align-self:flex-start;background:var(--sunk);border-end-start-radius:4px}
.msg.alert{background:var(--bad);color:var(--on-alert)}
.msg .src{display:block;margin-top:6px;font-size:.75rem;opacity:.75}
.msg.typing{display:flex;gap:4px;padding:14px}
.msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.chat-in{border-top:1px solid var(--line);padding:10px;display:grid;gap:8px}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.sugg button:hover{border-color:var(--accent)}
.chat-in form{display:flex;gap:8px}
.chat-in .input{flex:1;min-width:0}
.fab{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:8;border-radius:999px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .35s var(--ease),opacity .35s}
.fab.hide{transform:translateY(90px);opacity:0;pointer-events:none}

/* Questions */
.qs{display:grid;gap:8px;padding:0;margin:0;list-style:none;max-width:640px}
.q-item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,background .2s}
.q-item input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:all .25s var(--ease)}
.box svg{width:14px;height:14px;color:var(--accent-ink);transform:scale(0);transition:transform .25s var(--ease)}
.q-item:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.q-item:has(input:checked) .box{background:var(--accent);border-color:var(--accent)}
.q-item:has(input:checked) .box svg{transform:scale(1)}
.q-item:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.qbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qbar span{color:var(--muted);font-size:.92rem}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:sheet .45s var(--ease)}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .inner{max-width:720px;margin:0 auto;display:grid;gap:18px}
.sheet ol{margin:0;padding-inline-start:1.4em;display:grid;gap:14px;font-size:1.6rem;font-family:var(--f-display);font-weight:700;line-height:1.3}

/* Doctor */
.prod{display:grid;gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:16px;box-shadow:var(--shadow)}
.pcard-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.price{font-family:var(--f-mono);font-size:.85rem;background:var(--sunk);padding:6px 10px;border-radius:8px}
.chip{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.chip.off{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.studies{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.study{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.study .res{font-weight:700}
.ex{font-family:var(--f-mono);font-size:.68rem;color:var(--warm);background:var(--warm-soft);padding:2px 6px;border-radius:5px;justify-self:start}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;min-width:420px}
table.t th,table.t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.yes{color:var(--good)}.st.no{color:var(--bad)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.act{justify-content:flex-start;padding:16px;border-radius:var(--r);text-align:start}
.hcp{max-width:520px;margin:0 auto;padding-block:48px;display:grid;gap:16px}
.hcp label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.hcp input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:3px;flex:none}

/* Rep + admin */
.dash{padding-block:8px 56px;display:grid;gap:24px}
.dash-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.kpi strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:16px}
.panel > h2{font-size:1.35rem}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--bg);transition:all .2s}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.checks label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.lastnote{border-inline-start:4px solid var(--glucose);background:color-mix(in srgb,var(--glucose) 12%,var(--surface));border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.visit{border-bottom:1px solid var(--line);padding-block:12px;display:grid;gap:6px}
.visit:last-child{border-bottom:0}
.visit .when{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.atabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.atabs::-webkit-scrollbar{display:none}
.atabs button{flex:none;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.atabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.matrix td,.matrix th{text-align:center!important}
.matrix td:first-child,.matrix th:first-child{text-align:left!important}
.matrix input{width:18px;height:18px;accent-color:var(--accent)}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.subrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px;align-items:end;border:1px dashed var(--line);border-radius:12px;padding:10px}
.mode{font-size:.85rem;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warm-soft);color:var(--ink)}
.mode svg{flex:none;width:18px;height:18px;color:var(--warm);margin-top:2px}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:40;transition:all .35s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1}
#app.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{padding-block:28px 96px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:grid;gap:8px}
footer strong{color:var(--ink)}

@media (max-width:820px){
  .hero,.explain,.two,.adhere{grid-template-columns:1fr}
  .hero{gap:24px;padding-block:16px 32px}
  .scene{max-height:320px;aspect-ratio:4/3}
  .tips,.myths,.paths,.flow,.se{grid-template-columns:1fr}
  .prev{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flip{min-height:170px}
  .simple{grid-template-columns:1fr;justify-items:start}
  .simple svg.vis{width:96px;height:96px}
}
@media (max-width:420px){.prev{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pre{transform:none}}
#dbody{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}

/* Doctor portal + admin console */
.paths.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:820px}
.consent{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.95rem}
.consent input{width:20px;height:20px;accent-color:var(--accent);margin-top:3px;flex:none}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums;text-align:end}
.appr{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.02em;color:var(--muted);background:var(--sunk);padding:3px 8px;border-radius:6px;justify-self:start;align-self:start;white-space:nowrap}
.qa{display:grid;gap:4px;justify-items:start;text-align:start;font-weight:400}
.qa strong{font-weight:700}
.qa span{font-size:.85rem;opacity:.85;font-weight:400}
.two > *{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;position:relative;min-width:0}
.item .btn{justify-self:start}
.evdate{position:absolute;top:16px;inset-inline-end:16px;text-align:center;line-height:1.1;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.evdate strong{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.4rem}
.evdate span{font-size:.7rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:0}
.kv div{display:grid;gap:2px}
.kv dt{font-size:.78rem;color:var(--muted)}
.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.newlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rowbtn{width:100%;display:grid;gap:2px;text-align:start;background:none;border:0;border-radius:10px;padding:10px;cursor:pointer;color:inherit}
.rowbtn:hover{background:var(--bg)}
.rowbtn.static{cursor:default}.rowbtn.static:hover{background:none}
.rowbtn .pst{justify-self:start;margin-top:4px}
.pst{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pst.active{background:var(--good-soft);color:var(--good)}
.pst.pending{background:color-mix(in srgb,var(--glucose) 20%,var(--surface));color:color-mix(in srgb,var(--glucose) 55%,var(--ink))}
.pst.suspended{background:var(--bad-soft);color:var(--bad)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warm);color:var(--on-alert);font-size:.72rem;font-weight:700;margin-inline-start:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;justify-self:start;max-width:100%}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.reqs{display:grid;gap:10px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.panel .req{background:var(--bg)}
.req.ae{border-inline-start:4px solid var(--warm)}
.req.done{opacity:.72}
.req p{margin:0;overflow-wrap:anywhere}
.req-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tchip{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tchip.t-ae{background:var(--warm-soft);color:var(--warm)}
.tchip.t-medinfo{background:var(--sunk);color:var(--ink)}
.aenote{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;color:var(--warm);font-weight:700}
.aenote svg{width:18px;height:18px;flex:none;margin-top:2px}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 3ch;gap:12px;align-items:center;font-size:.92rem}
.brow > span:first-child{overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:grid;max-height:420px;overflow:auto}
.log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.calc .result{display:grid;gap:2px;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.calc .result strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.calc .result span{font-size:.88rem}
.checks.radio label{position:relative}
.field.wide{grid-column:1/-1}
.subrow .field.wide{grid-column:1/-1}
.kpi strong{font-size:2rem}

/* Motion: one entrance rhythm for lists and cards, light hover lift, live feedback */
@keyframes rise{from{opacity:.35;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warm) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stag > *{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms)}
.item,.pcard,.req,.kpi,.study,.path{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.item:hover,.pcard:hover,.req:hover,.kpi:hover,.study:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.path .ico{animation:floaty 4s ease-in-out infinite}
.path:nth-child(2) .ico{animation-delay:-2s}
.atabs button{position:relative;transition:color .2s}
.atabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;transform-origin:left;animation:sweep .35s var(--ease)}
.atabs button[aria-selected="true"]{border-color:transparent}
.cnt{animation:pulse 1.6s ease-out 2}
.calc .result.bump strong{animation:pop .35s var(--ease)}
.toast.show{animation:pop .35s var(--ease)}
.qa svg,.btn:hover .arr{transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(3px)}
[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(3px)}
.rowbtn{transition:background .2s,transform .2s var(--ease)}
.rowbtn:not(.static):hover{transform:translateX(4px)}
.sheet .inner > *{animation:rise .45s var(--ease) both}
.sheet .inner > *:nth-child(2){animation-delay:.04s}.sheet .inner > *:nth-child(3){animation-delay:.08s}.sheet .inner > *:nth-child(n+4){animation-delay:.12s}
.checks label{transition:background .2s,border-color .2s,color .2s,transform .15s var(--ease)}
.checks label:active{transform:scale(.96)}
.boot{min-height:60vh;display:grid;place-items:center}.boot .logo{margin:0;animation:breathe 1.6s ease-in-out infinite}
#app.busy{opacity:.6;pointer-events:none;transition:opacity .2s}
/* Patient page: medicines, animations, results */
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:400/240;max-width:100%}
h1.split .w{display:inline-block;animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms)}
.mymeds{display:grid;gap:8px;margin-top:18px}
.mymeds > div{display:flex;flex-wrap:wrap;gap:8px}
.medtag{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px 7px 10px;cursor:pointer;font-weight:700;font-size:.92rem;animation:rise .6s var(--ease) backwards;animation-delay:calc(.4s + var(--i,0) * 90ms);transition:transform .2s var(--ease),border-color .2s}
.medtag:hover{transform:translateY(-2px);border-color:var(--accent)}
.medtag svg{width:18px;height:18px;color:var(--accent);animation:wobble 3s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.medpick{display:grid;gap:12px}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:.95rem;transition:background .25s var(--ease),color .25s,border-color .25s,transform .15s var(--ease)}
.mchip:hover{border-color:var(--accent)}
.mchip:active{transform:scale(.96)}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.medcard.swapin > *{animation:rise .5s var(--ease) both}
.medcard.swapin > *:nth-child(2){animation-delay:.08s}
.step{transition:background .3s var(--ease),box-shadow .3s}
.step.on .n{animation:pop .4s var(--ease)}
/* Little illustrations in "In simple words" */
.vis .v-key{animation:vkey 2.8s var(--ease) infinite}
@keyframes vkey{0%,15%{transform:translateX(-6px)}55%,75%{transform:translateX(8px)}100%{transform:translateX(-6px)}}
.vis .v-lock{transform-box:fill-box;transform-origin:center;animation:vlock 2.8s var(--ease) infinite}
@keyframes vlock{0%,50%{transform:none}60%{transform:scale(1.06)}72%,100%{transform:none}}
.vis .v-beat{transform-box:fill-box;transform-origin:center;animation:vbeat 1.1s ease-in-out infinite}
@keyframes vbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(.98)}36%{transform:scale(1.04)}}
.vis .v-ecg{stroke-dasharray:1;stroke-dashoffset:1;animation:vecg 2.2s linear infinite}
@keyframes vecg{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.vis .v-drip{animation:vdrip 2.4s ease-in infinite}
.vis .v-drip.d2{animation-delay:.6s}.vis .v-drip.d3{animation-delay:1.2s}
@keyframes vdrip{0%{transform:translateY(0);opacity:1}70%{transform:translateY(22px);opacity:1}100%{transform:translateY(26px);opacity:0}}
.vis .v-fall{animation:vfall 1.6s ease-in infinite}
@keyframes vfall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.fact b{animation:pop .5s var(--ease) both}
/* Non-pharmacological cards */
.np{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.npc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start;transition:border-color .25s,box-shadow .25s,transform .25s var(--ease)}
.npc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.npc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.npi{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;animation:breathe 3.6s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.6s)}
.npi svg{width:24px;height:24px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.npc p{color:var(--muted);font-size:.95rem}
.npb{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;margin-top:4px;transition:all .2s}
.npb svg{width:14px;height:14px}
.npb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;animation:pop .35s var(--ease)}
.planbar{font-weight:700;color:var(--accent)}
.flip .hint svg{animation:wobble 2.4s ease-in-out infinite}
.prev .ico{animation:breathe 4s ease-in-out infinite}
/* Results */
.linkbox{display:grid;gap:10px;background:var(--surface);border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:var(--r);padding:16px}
.linkbox.ok{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-style:solid;background:var(--good-soft);border-color:transparent;color:var(--ink)}
.linkbox.ok > span:first-child{color:var(--good);display:grid}
.linkbox.ok svg{width:18px;height:18px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow .input{flex:1;min-width:160px;text-transform:uppercase}
.res{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.rchart svg{display:block;width:100%;height:auto}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:drawline 1.2s var(--ease) both}
@keyframes drawline{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.rchart .pt{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease) both;animation-delay:calc(.5s + var(--i,0) * 50ms)}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.rlist li:last-child{border-bottom:0}
.rv{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.rlist .muted{font-size:.85rem}
.rst{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.rst.ok{background:var(--good-soft);color:var(--good)}
.rst.high,.rst.alert{background:var(--bad-soft);color:var(--bad)}
.rst.low{background:color-mix(in srgb,var(--glucose) 20%,var(--surface));color:color-mix(in srgb,var(--glucose) 60%,var(--ink))}
.radv{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-size:.88rem;color:var(--bad);font-weight:700}
.radv svg{width:18px;height:18px;flex:none;margin-top:2px}
/* Doctor: patients */
.bigcode{font-size:clamp(2.4rem,9vw,4rem);font-weight:700;letter-spacing:.08em;color:var(--accent);animation:pop .5s var(--ease)}
.sheet .inner.wide{max-width:900px}
.ptc h3{font-size:1.3rem}
@media (max-width:820px){.res{grid-template-columns:1fr}}
@media (max-width:720px){.paths.two{grid-template-columns:1fr}.log li{grid-template-columns:1fr;gap:2px}.two{grid-template-columns:1fr}}

 nephro:{
  en:{condition:"Chronic kidney disease",
   simple:"Your kidneys are your body's filters, a bit like a coffee filter. They clean waste and extra water out of your blood. In chronic kidney disease, the filters slowly wear out and clean less well.",
   intro:"It often has no symptoms early on, which is why regular blood and urine tests matter. Treatment aims to slow it down and protect the kidney function you have.",

function rStatus(k,r,list,topic){
  if(k==="sugar"){if(r.v<70)return "low";if(r.kind==="after"?r.v>180:r.v>130)return "high";return "ok"}
  if(k==="bp"){if(r.v>=180||r.v2>=120)return "alert";if(r.v>=130||r.v2>=80)return "high";if(r.v<90)return "low";return "ok"}
  if(k==="hr"){if(r.v<50)return "low";if(r.v>100)return "high";return "ok"}
  if(k==="hba1c")return r.v>7?"high":"ok";
  if(k==="weight"&&topic==="cardio"){const t=+new Date(r.at),old=list.filter(x=>x!==r&&t-+new Date(x.at)>0&&t-+new Date(x.at)<=3*864e5);
    if(old.length&&r.v-Math.min(...old.map(x=>x.v))>=2)return "alert"}
  return "ok";
}
function advice(k,r,st,lang){const p=P2[lang];if(k==="sugar"&&st==="low")return p.lowSugar;if(k==="bp"&&st==="alert")return p.veryHighBp;if(k==="weight"&&st==="alert")return p.weightJump;return ""}
const valTxt=(k,r)=>k==="bp"?`${r.v}/${r.v2}`:String(r.v);
function chartSVG(list,k,topic,lang){
  if(!list.length)return "";

  const vals=L.flatMap(r=>k==="bp"?[r.v,r.v2]:[r.v]);

  let lo=Math.min(...vals,...(guide||[])),hi=Math.max(...vals,...(guide||[]));const pad=(hi-lo||Math.max(1,hi*.1))*.18;lo-=pad;hi+=pad;
  const x=i=>L.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(L.length-1),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=key=>L.map((r,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(r[key]).toFixed(1)}`).join(" ");
  const ticks=[lo+pad,(lo+hi)/2,hi-pad].map(v=>Math.round(v*10)/10);
  const dfmt=d=>new Date(d).toLocaleDateString(lang==="ar"?"ar-AE":"en-GB",{day:"numeric",month:"short"});
  let band="";
  if(guide&&guide[0]!==guide[1])band=`<rect x="${pl}" y="${y(guide[1])}" width="${W-pl-pr}" height="${Math.max(1,y(guide[0])-y(guide[1]))}" fill="var(--good-soft)"/>`;
  if(guide&&guide[0]===guide[1])band=`<line x1="${pl}" x2="${W-pr}" y1="${y(guide[0])}" y2="${y(guide[0])}" stroke="var(--good)" stroke-dasharray="4 4"/>`;
  if(k==="bp")band=`<line x1="${pl}" x2="${W-pr}" y1="${y(130)}" y2="${y(130)}" stroke="var(--good)" stroke-dasharray="4 4"/><line x1="${pl}" x2="${W-pr}" y1="${y(80)}" y2="${y(80)}" stroke="var(--good)" stroke-dasharray="4 4"/>`;
  const dots=key=>L.map((r,i)=>{const st=rStatus(k,r,list,topic);return `<circle class="pt" style="--i:${i}" cx="${x(i).toFixed(1)}" cy="${y(r[key]).toFixed(1)}" r="5" fill="${st==="ok"?"var(--accent)":st==="low"?"var(--glucose)":"var(--bad)"}" stroke="var(--surface)" stroke-width="2"/>`}).join("");
  return `<div class="rchart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(MEAS[k][lang])} chart">
    ${band}${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" opacity=".7"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${v}</text>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${dfmt(L[0].at)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${dfmt(L[L.length-1].at)}</text>
    ${k==="bp"?`<path class="draw" pathLength="1" d="${path("v2")}" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
    <path class="draw" pathLength="1" d="${path("v")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>

function startMech(){
  const cv=$("#mech");if(!cv)return;const m=MEDS[curMed()];MECH.kind=m.anim;MECH.variant=m.variant||null;MECH.ctx=cv.getContext("2d");MECH.onK=S.treat?1:0;MECH.st={};mcol();
  const sc=SCENES[MECH.kind];sc.init(MECH.st);const W=400,H=240,dpr=cv.width/W;
  const frame=dt=>{MECH.onK+=((S.treat?1:0)-MECH.onK)*Math.min(1,dt/450);sc.update(MECH.st,dt,MECH.onK);const c=MECH.ctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);sc.draw(c,MECH.st,MECH.onK)};
  MECH.frame=frame;
  if(reduce()){for(let i=0;i<120;i++)sc.update(MECH.st,50,S.treat?1:0);MECH.onK=S.treat?1:0;frame(0);return}
  const tick=now=>{if(!MECH.vis)return;const dt=MECH.last?Math.min(60,now-MECH.last):16;MECH.last=now;frame(dt);MECH.raf=requestAnimationFrame(tick)};
  MECH.vis=true;MECH.last=0;MECH.raf=requestAnimationFrame(tick);
  if("IntersectionObserver" in window){MECH.io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!MECH.vis){MECH.vis=true;MECH.last=0;MECH.raf=requestAnimationFrame(tick)}else if(!e.isIntersecting){MECH.vis=false;cancelAnimationFrame(MECH.raf)}}));MECH.io.observe(cv)}
}
function stopMech(){cancelAnimationFrame(MECH.raf);MECH.vis=false;MECH.io&&MECH.io.disconnect();MECH.io=null}

const norm=s=>String(s).toLowerCase().replace(/[ً-ْ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
const EMERG=["chest pain","cant breathe","can t breathe","cannot breathe","not breathing","fainted","passed out","unconscious","stroke","overdose","took too many","suicide","kill myself","seizure","الم في الصدر","لا استطيع التنفس","لا اقدر اتنفس","اغماء","جرعه زائده","انتحار","تشنج"];
function answer(q){
  const t=UI[S.lang],p2=P2[S.lang],n=" "+norm(q)+" ",L=S.lang;
  if(EMERG.some(k=>n.includes(" "+norm(k))))return {text:t.emerg,alert:true};
  const tp=ptTopic(),d=PC[tp][L],ml=ptMedList(),mine=[...ml.yours,...ml.others];
  /* "my last sugar / weight ..." answers from the patient's own readings */
  const mk={sugar:["sugar","glucose","سكر"],bp:["pressure","bp","ضغط"],weight:["weight","وزن","وزني"],hr:["pulse","heart rate","نبض"],hba1c:["hba1c","a1c","تراكمي"],egfr:["egfr"]};
  if(/( my | last | latest |اخر|قراءت|نتيج)/.test(n)){for(const [k,ws] of Object.entries(mk)){if(ws.some(w=>n.includes(norm(w)))&&TOPIC_MEAS[tp].includes(k)){const r=DB.readings(ptPid(),k).slice(-1)[0];
    if(r){const st=rStatus(k,r,DB.readings(ptPid(),k),tp);return {text:`${MEAS[k][L]}: ${valTxt(k,r)} ${MEAS[k].unit} (${p2.st[st]}), ${new Date(r.at).toLocaleString(L==="ar"?"ar-AE":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}.${advice(k,r,st,L)?" "+advice(k,r,st,L):""}`,src:t.from+p2.sRes}}}}}
  const medKB=Object.entries(MEDS).flatMap(([k,m])=>{const x=m[L],kw=[...m.kw,x.name],src=t.from+x.name;return [
    {q:(L==="ar"?"كيف يعمل ":"How does ")+x.name+(L==="ar"?"؟":" work?"),a:x.steps.join(" "),k:[...kw],src,w:mine.includes(k)?1:0},
    {q:x.name+(L==="ar"?" الآثار الجانبية":" side effects"),a:x.common.join(" ")+" "+(L==="ar"?"اطلب المساعدة فوراً إذا: ":"Get help right away if: ")+x.urgent.join(" "),k:[...kw,...(L==="ar"?["آثار","جانبيه","اعراض"]:["side","effect","effects"])],src,w:0},
    {q:x.name+(L==="ar"?" طريقة الاستعمال":" how to take"),a:x.take+(x.note?" "+x.note:""),k:[...kw,...(L==="ar"?["متى","استعمال","اخذ","اتناول"]:["take","when","food","time"])],src,w:0},
    {q:x.name+(L==="ar"?" جرعة فائتة":" missed dose"),a:x.missed,k:[...kw,...(L==="ar"?["نسيت","فاتت","فاتتني"]:["miss","missed","forgot"])],src,w:0}]});
  const np=NONPHARM[tp][L].map(([,h,p])=>({q:h,a:p,k:[h],src:t.from+p2.lifeH}));
  const kb=[...d.faq.map(x=>({q:x[0],a:x[1],k:x[2],src:t.sFaq})),...MEDFAQ[L].map(x=>({q:x[0],a:x[1],k:x[2],src:t.sMed})),...medKB,...np,
    ...d.myths.map(x=>({q:x[0],a:MYTH[L][x[1]]+". "+x[2],k:[],src:t.sMyth})),...d.prevent.map(x=>({q:x[0],a:x[1],k:[x[0]],src:t.sPrevent}))];
  /* "my medicine" means the chosen one */
  const myMed=/(my medicine|my medication|my tablet|my pill|my injection|دوائي|علاجي)/.test(n);
  const words=n.split(" ").filter(w=>w.length>3);
  let best=null,bs=0;
  kb.forEach(e=>{let s=0;e.k.forEach(k=>{const nk=norm(k);if(nk&&n.includes(nk))s+=2+nk.length/6});
    const qw=new Set(norm(e.q).split(" ").filter(w=>w.length>3));words.forEach(w=>{if(qw.has(w))s+=1});
    if(myMed&&e.src===t.from+MEDS[curMed()][L].name)s+=3;s+=(e.w||0)*.2;
    if(s>bs){bs=s;best=e}});
  if(best&&bs>=2)return {text:best.a,src:best.src.startsWith(t.from)?best.src:t.from+best.src};
  if(!S.custom.includes(q)){S.custom.push(q);S.checked.add(d.questions.length+S.custom.length-1)}
  return {text:t.noAns,addQ:true};
}

function calcEgfr(){
  const f=$("#egfrForm");if(!f)return;let cr=parseFloat($("#cr").value);const age=parseFloat($("#cage").value),fem=$("#csex").value==="f",out=$("#egfrOut");
  if($("#cru").value==="umol")cr=cr/88.4;
  if(!(cr>0)||!(age>=18&&age<=120)){out.innerHTML=`<span class="muted">Enter a creatinine value and an age of 18 or over.</span>`;return}
  const k=fem?.7:.9,a=fem?-.241:-.302,e=142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.2)*Math.pow(.9938,age)*(fem?1.012:1);
  const g=e>=90?"G1":e>=60?"G2":e>=45?"G3a":e>=30?"G3b":e>=15?"G4":"G5";
  out.innerHTML=`<strong>${Math.round(e)}</strong><span>mL/min/1.73m² · stage ${g}</span>`;
}

  const ph={visit:"What would you like to discuss? (optional)",sample:"Anything your rep should know (optional)",materials:"Language or delivery notes (optional)",medinfo:"Your question",ae:"What happened, when it started, and how the patient is now",event:"Dietary or access needs (optional)"}[type];
  const need=type==="medinfo"||type==="ae";

    <p class="err" id="rerr" role="alert"></p><div><button class="btn ${type==="ae"?"warm":""}" type="submit">${IC.send} Send</button></div></form>`;

function setPath(o,p,v){const k=p.split(".");let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v}
function getPath(o,p){return p.split(".").reduce((x,k)=>x[k],o)}
function delPath(o,p){const k=p.split(".");let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x.splice(+k[k.length-1],1)}

/* ================= Render + behaviour ================= */
function view(){
  switch(S.screen){
    case "patient":return patient();
    case "login":return loginScreen();
    case "join":return joinScreen();
    case "home":
      if(!S.user)return loginScreen();
      if(isStaff())return admin();
      return S.user.status==="active"?portal():pendingScreen();
    default:return welcome();
  }
}
function paint(anim){
  document.documentElement.classList.toggle("big",S.big&&S.screen==="patient");
  root().innerHTML=`<div id="app">${view()}</div>`;
  if(anim&&!reduce())$("#app").classList.add("swap");
  afterPaint();
}
function go(screen){S.screen=screen;paint(true);window.scrollTo(0,0)}
async function enterHome(){S.draft=null;if(DB.load){root().querySelector("#app")?.classList.add("busy");try{await DB.load()}catch(e){toast("Couldn't load your data. Check your connection.")}}S.user=DB.me();S.cfg=DB.getConfig();go("home")}

function motion(){
  if(reduce())return;
  $$(".np,.actions,.grid2,.reqs,.kpis,.studies,.prod,.paths,.newlist,.bars,.tiplist,.prev,.facts").forEach(g=>{g.classList.add("stag");[...g.children].forEach((c,i)=>c.style.setProperty("--i",Math.min(i,10)))});
  $$(".kpi strong").forEach(el=>{const end=parseInt(el.textContent,10);if(!(end>1))return;const t0=performance.now(),dur=700;
    const step=now=>{const k=Math.min(1,(now-t0)/dur),v=Math.round(end*(1-Math.pow(1-k,3)));el.textContent=v;if(k<1)requestAnimationFrame(step)};el.textContent="0";requestAnimationFrame(step)});
}
function bump(id){const r=$(id);if(!r||reduce())return;r.classList.remove("bump");void r.offsetWidth;r.classList.add("bump")}
function afterPaint(){
  if(S.screen==="patient"){startMech();bindResults();playScene();reveal();spy();fabWatch();
    const f=$("#chatForm");if(f)f.onsubmit=e=>{e.preventDefault();const i=$("#chatIn");sendChat(i.value);i.value=""};
    const log=$("#chatLog");if(log)log.scrollTop=log.scrollHeight;}
  else{stopFx()}
  const af=$("#authForm");if(af)af.onsubmit=async e=>{e.preventDefault();const err=$("#aerr");err.textContent="";
    const b=af.querySelector("button");b.disabled=true;try{S.user=await DB.signIn($("#au").value.trim().toLowerCase(),$("#ap").value);await enterHome()}catch(x){err.textContent=x.message;b.disabled=false}};
  const jf=$("#joinForm");if(jf)jf.onsubmit=onJoin;
  const nf=$("#adminForm");if(nf)nf.onsubmit=async e=>{e.preventDefault();try{await DB.addAdmin($("#nu").value.trim().toLowerCase());toast("Admin added");paint()}catch(x){$("#nerr").textContent=x.message}};
  const ef=$("#egfrForm");if(ef){ef.oninput=()=>{calcEgfr();bump("#egfrOut")};ef.onsubmit=e=>e.preventDefault();calcEgfr()}
  const cf=$("#chaForm");if(cf){cf.onchange=()=>{calcCha();bump("#chaOut")};cf.onsubmit=e=>e.preventDefault();calcCha()}
  const dc=$("#demoCard");if(dc)dc.onchange=()=>{setCard(dc.value,false);paint()};
  motion();
}
async function onJoin(e){
  e.preventDefault();const v=id=>$(id).value.trim(),err=$("#jerr");err.textContent="";
  const f={name:v("#jn"),specialty:$("#js").value,auth:$("#ja").value,license:v("#jl").toUpperCase(),clinic:v("#jc"),email:v("#je"),username:v("#ju").toLowerCase(),password:$("#jp").value};
  if(!/^[a-z0-9_.]{3,20}$/.test(f.username)){err.textContent="Username: use 3 to 20 lowercase letters, numbers, dots or underscores.";return}
  if(f.password.length<8){err.textContent="Password must be at least 8 characters.";return}
  if(f.license.length<4){err.textContent="Enter your full license number.";return}
  if(!$("#jh").checked||!$("#jpv").checked){err.textContent="Tick both boxes to send your request.";return}
  const b=e.target.querySelector("button[type=submit]");b.disabled=true;try{S.user=await DB.join(f);await enterHome()}catch(x){err.textContent=x.message;b.disabled=false}
}
function setCard(id,count){
  S.cardId=id;S.card=cardFor(id)||cardFor(S.cfg.cards[0]?.id)||{card_id:id,name:"Your clinic",specialty:"Endocrinology",clinic:""};
  S.tab=0;S.treat=false;S.step=0;S.missed=false;S.checked.clear();S.custom=[];S.chat=[];
  try{history.replaceState(null,"","#"+S.card.card_id)}catch(e){}
  if(count)DB.logScan(S.card.card_id);
}
function twoTap(a,label,fn){if(a.dataset.sure){fn()}else{const t=a.textContent;a.dataset.sure="1";a.textContent=label;setTimeout(()=>{if(a.isConnected){delete a.dataset.sure;a.textContent=t}},3000)}}

/* One click handler for the whole app */
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,arg=a.dataset.arg;
  if(act!=="ask"&&a.tagName==="A")return;
  switch(act){
    case "go":if(arg==="home"||arg==="login"){if(S.user){enterHome();return}}go(arg);break;
    case "lang":S.lang=S.lang==="en"?"ar":"en";S.tab=0;S.chat=[];savePrefs();paint(true);break;
    case "size":S.big=!S.big;savePrefs();document.documentElement.classList.toggle("big",S.big);a.setAttribute("aria-pressed",S.big);break;
    case "treat":setTreat(!S.treat);break;
    case "step":{const i=+arg;setTreat(i>=2);break}
    case "pmed":swapMed(arg,!!a.dataset.jump);break;
    case "plan":{if(plan.has(arg))plan.delete(arg);else plan.add(arg);try{localStorage.setItem("tc-plan",JSON.stringify([...plan]))}catch(x){}
      const on=plan.has(arg),p2=P2[S.lang],tp=ptTopic();a.setAttribute("aria-pressed",on);a.innerHTML=on?IC.check+" "+esc(p2.inPlan):IC.plus+" "+esc(p2.plan);a.closest(".npc").classList.toggle("on",on);
      $("#planN").textContent=p2.planN([...plan].filter(x=>x.startsWith(tp+":")).length);break}
    case "rmeas":S.rm=arg;redrawResults();break;
    case "unlink":try{localStorage.removeItem("tc-pt-code")}catch(x){}S.pt=null;if(CLOUD())C.readings=[];S.med=null;paint(true);setTimeout(()=>$("#results")?.scrollIntoView({block:"start"}),60);break;
    case "ptNew":ptEdit(null);break;
    case "ptEdit":ptEdit(arg);break;
    case "ptOpen":ptOpen(arg);break;
    case "copyCode":try{await navigator.clipboard.writeText(arg);toast("Code copied")}catch(x){toast(arg)}break;
    case "missed":S.missed=!S.missed;a.setAttribute("aria-checked",S.missed);
      {const l=$("#adhLine");l.setAttribute("d",S.missed?ADH.missed:ADH.steady);l.setAttribute("stroke",S.missed?"var(--warm)":"var(--accent)");
       $$(".pills7 span").forEach((s,i)=>s.classList.toggle("off",S.missed&&[2,3,5].includes(i)))}break;
    case "ltab":{S.tab=+arg;$$(".tab").forEach(x=>x.setAttribute("aria-selected",x===a));const d=PC[ptTopic()][S.lang],el=$("#tips");
      el.classList.remove("anim");el.innerHTML=tipsHTML(d.life[Object.keys(d.life)[S.tab]]);void el.offsetWidth;el.classList.add("anim");break}
    case "flip":a.setAttribute("aria-pressed",a.getAttribute("aria-pressed")!=="true");break;
    case "ask":sendChat(arg);break;
    case "showQs":showQs();break;
    case "toast":toast(arg);break;
    case "demoAs":if(DB.demoAs){S.user=DB.demoAs(arg);if(S.user)enterHome()}break;
    case "logout":await DB.signOut();S.user=null;S.draft=null;S.ptab="home";S.atab="requests";go("welcome");break;
    case "refreshMe":if(DB.load)await DB.load();S.user=DB.me();if(!S.user){go("login");break}if(S.user.status==="active")toast("You're approved. Welcome!");else toast("Still waiting for approval.");enterHome();break;
    /* doctor */
    case "ptab":if(CLOUD()&&arg==="patients")await DB.load();S.ptab=arg;if(SECNAME[arg])DB.log("view",SECNAME[arg]);paint(true);window.scrollTo(0,0);break;
    case "open":{const [item,msg]=arg.split("|");DB.log("view",item);toast(msg);break}
    case "req":requestSheet(arg,a.dataset.pick);break;
    case "deleteMe":twoTap(a,"Tap again to delete for good",async()=>{const id=S.user.id;DB.log("delete account","");try{await DB.removeUser(id)}catch(x){toast(x.message);return}await DB.signOut();S.user=null;go("welcome");toast("Your account was deleted")});break;
    /* admin */
    case "atab":if(CLOUD()&&!S.draft)await DB.load();if(S.draft&&arg!==S.atab&&["content","settings"].includes(S.atab))S.draft=null;S.atab=arg;paint(true);break;
    case "rfilter":S.rfilter=arg;paint(true);break;
    case "reqDone":try{await DB.setRequest(arg,"done")}catch(x){toast(x.message);break}toast("Marked as handled");paint();break;
    case "reqOpen":try{await DB.setRequest(arg,"new")}catch(x){toast(x.message);break}paint();break;
    case "access":accessSheet(arg);break;
    case "decline":twoTap(a,"Tap again to decline",async()=>{const d=S.users.find(x=>x.id===arg);try{await DB.removeUser(arg)}catch(x){toast(x.message);return}DB.log("decline",d?.name);toast("Request declined");paint()});break;
    case "delAdmin":twoTap(a,"Tap again",async()=>{try{await DB.demoteAdmin(arg);toast("No longer an admin");paint()}catch(x){toast(x.message)}});break;
    case "ctab":S.ctab=arg;paint(true);break;
    case "addRow":{const k=arg.split(".").pop();getPath(S.draft,arg).push(BLANK[k]());paint();break}
    case "delRow":delPath(S.draft,arg);paint();break;
    case "addSpec":{const v=$("#newSpec").value.trim();if(v&&!S.draft.specialties[v]){S.draft.specialties[v]=[];paint()}break}
    case "addInd":{const v=$("#newInd").value.trim();if(v){S.draft.indications["i"+uid().slice(0,5)]=v;paint()}break}
    case "addCard":S.draft.cards.push({id:"TC-"+Math.random().toString(36).slice(2,8).toUpperCase(),doctor:"Dr. New Card",clinic:"",specialty:Object.keys(S.draft.specialties)[0]});paint();break;
    case "copyLink":{const link=location.origin+location.pathname+"#"+arg;try{await navigator.clipboard.writeText(link);toast("Card link copied")}catch(x){toast(link)}break}
    case "resetDraft":S.draft=null;paint();toast("Changes undone");break;
    case "saveCfg":try{await DB.saveConfig(S.draft);S.cfg=clone(S.draft);setCard(S.cardId,false);toast("Saved")}catch(x){toast(x.message||"Couldn't save. Try again.")}break;
    case "resetDemo":twoTap(a,"Tap again to reset everything",()=>{DB.reset();location.reload()});break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.q!==undefined){const i=+t.dataset.q;t.checked?S.checked.add(i):S.checked.delete(i);$("#qCount").textContent=UI[S.lang].picked(S.checked.size)}
  if(!S.draft)return;
  if(t.dataset.mx){const [s,i]=t.dataset.mx.split("|"),arr=S.draft.specialties[s];t.checked?arr.includes(i)||arr.push(i):arr.splice(arr.indexOf(i),1)}
  if(t.dataset.topic){S.draft.topicFor[t.dataset.topic]=t.value}
  if(t.dataset.arr){const arr=getPath(S.draft,t.dataset.arr);t.checked?arr.includes(t.value)||arr.push(t.value):arr.splice(arr.indexOf(t.value),1)}
  if(t.dataset.path&&(t.tagName==="SELECT"||t.type==="date"))setPath(S.draft,t.dataset.path,t.value);
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.path&&t.tagName!=="SELECT"&&S.draft)setPath(S.draft,t.dataset.path,t.value)});
document.addEventListener("keydown",e=>{const s=e.target.closest?.(".step");if(s&&(e.key==="Enter"||e.key===" ")){e.preventDefault();s.click()}});
document.addEventListener("click",e=>{const a=e.target.closest('#app a[href^="#"]');if(!a)return;const el=document.getElementById(a.getAttribute("href").slice(1));if(!el)return;
  e.preventDefault();el.scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"})});

function showQs(){
  const t=UI[S.lang],d=PC[ptTopic()][S.lang],qs=[...d.questions,...S.custom];
  if(!S.checked.size){toast(t.none);return}
  const sh=document.createElement("div");sh.className="sheet";sh.setAttribute("lang",S.lang);sh.dir=S.lang==="ar"?"rtl":"ltr";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");
  sh.innerHTML=`<div class="inner"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="label">${esc(S.card.clinic)}</span><button class="btn ghost" data-close>${esc(t.close)}</button></div>
    <h1>${esc(t.sheetH)}</h1><ol>${[...S.checked].sort((a,b)=>a-b).map(i=>`<li>${esc(qs[i])}</li>`).join("")}</ol></div>`;
  document.body.appendChild(sh);document.body.style.overflow="hidden";const cl=sh.querySelector("[data-close]");cl.focus();
  const close=()=>{sh.remove();document.body.style.overflow=""};cl.onclick=close;sh.onkeydown=e=>{if(e.key==="Escape")close()};
}

/* Animations that pause when off screen */
let sceneIO=null,io=null,spyIO=null,fabIO=null;
function stopFx(){stopMech();[sceneIO,io,spyIO,fabIO].forEach(o=>o&&o.disconnect())}
function playScene(){const s=$("#scene");if(!s||reduce())return;if(!("IntersectionObserver" in window)){s.classList.add("play");return}
  sceneIO=new IntersectionObserver(es=>es.forEach(e=>s.classList.toggle("play",e.isIntersecting)));sceneIO.observe(s)}
function reveal(){if(!("IntersectionObserver" in window)||reduce())return;
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.06});
  $$("section.block").forEach(s=>{if(s.getBoundingClientRect().top>innerHeight){s.classList.add("pre");io.observe(s)}})}
function spy(){const links=$$(".chips a");if(!links.length||!("IntersectionObserver" in window))return;
  spyIO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;links.forEach(a=>a.classList.toggle("on",a.dataset.sec===e.target.id));
    const on=links.find(a=>a.dataset.sec===e.target.id);if(on){const nav=on.parentElement;nav.scrollTo({left:Math.max(0,on.offsetLeft-nav.clientWidth/2+on.offsetWidth/2)})}}),{rootMargin:"-40% 0px -55% 0px"});
  links.forEach(a=>{const s=document.getElementById(a.dataset.sec);s&&spyIO.observe(s)})}
function fabWatch(){const f=$("#fab"),sec=$("#assistant"),hero=$(".hero");if(!f||!("IntersectionObserver" in window))return;
  const vis=new Set();fabIO=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));f.classList.toggle("hide",vis.size>0)});
  fabIO.observe(sec);hero&&fabIO.observe(hero)}

/* Visit counter for the card page (GoatCounter) */
function counter(){if(!COUNTER_CODE||!/^https:/.test(location.protocol))return;const sc=document.createElement("script");sc.async=true;sc.src="https://gc.zgo.at/count.js";
  sc.setAttribute("data-goatcounter","https://"+COUNTER_CODE+".goatcounter.com/count");document.body.appendChild(sc)}

/* Start */
(async()=>{
  root().innerHTML=`<div class="boot"><span class="logo"><i>${IC.logo}</i>TapCare</span></div>`;
  await initCloud();
  if(CLOUD()){try{await DB.load()}catch(e){}}
  S.cfg=DB.getConfig();
  const h=decodeURIComponent((location.hash||"").slice(1));
  const fromCard=/^TC-[A-Z0-9-]{3,20}$/.test(h)&&!!cardFor(h);
  setCard(fromCard?h:(S.cfg.cards[0]?.id||"TC-ENDO-001"),fromCard);
  S.user=DB.me();
  try{const code=localStorage.getItem("tc-pt-code");if(code){S.pt=await DB.findCode(code);if(S.pt)await DB.ptLoad(code);else localStorage.removeItem("tc-pt-code")}}catch(e){S.pt=null}
  paint();counter();
})();

</script>
