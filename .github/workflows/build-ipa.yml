name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
   runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the Supabase library
        run: curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js -o TapCare/web/supabase.js

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project TapCare.xcodeproj \
            -scheme TapCare \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TapCare.app Payload/
          zip -qry TapCare.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TapCare-ipa
          path: TapCare.ipa
